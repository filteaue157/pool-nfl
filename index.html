<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pool NFL — Grimm</title>
<meta name="theme-color" content="#0D1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pool NFL">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" sizes="32x32" href="icone-32.png">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* Le site, dans son cadre, ne connaît pas l'encoche ni la barre d'accueil
     de l'iPhone (env(safe-area-inset-*) y vaut 0). C'est donc cette page qui
     les dégage : le cadre commence sous la barre d'état et s'arrête au-dessus
     de la barre d'accueil. On évite height:100 % et 100vh, faussés en mode
     « écran d'accueil » (le cadre perdait la hauteur de la barre d'état, d'où
     une bande vide en bas) : le cadre est borné par top et bottom. */
  html,body{margin:0;background:#0D1117}
  /* Un iframe ne s'étire pas entre top et bottom (il garderait 150 px) :
     c'est la boîte .cadre qui s'étire, et le cadre la remplit. */
  .cadre{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px)}
  iframe{width:100%;height:100%;border:0;display:block;background:#0D1117}
  /* Sous la barre d'accueil : la couleur de la barre de navigation du site,
     pour qu'elle paraisse descendre jusqu'au bord de l'écran. */
  .bas{position:fixed;left:0;right:0;bottom:0;height:env(safe-area-inset-bottom,0px);background:#151B24}
  noscript{color:#EDF1F6;font:16px system-ui;padding:24px;display:block}
</style>
</head>
<body>
<!--
  PAGE D'ACCUEIL DU POOL NFL (GitHub Pages)

  Pourquoi : sur iPhone, Safari interdit au site Apps Script — affiché dans
  un cadre de Google — de garder quoi que ce soit en mémoire. Cette page-ci,
  elle, est le site principal aux yeux de Safari : elle a le droit de garder
  la connexion (nom d'équipe, connecté oui/non, rivaux) dans le navigateur
  de chacun, et la redonne au site à chaque ouverture, par l'adresse.
  Elle donne aussi au pool sa propre icône d'écran d'accueil.

  Ce qu'elle garde : seulement ce que le site lui envoie (nom d'équipe,
  jeton de session, rivaux), dans le navigateur de la personne. Le jeton
  permet d'enregistrer ses préférences sans retaper son code ; il ne donne
  accès à rien d'autre, et « Ce n'est pas moi » l'annule côté serveur.
  Aucun code d'accès, aucun courriel, rien n'est envoyé ailleurs.

  À REMPLIR : l'adresse /exec du site (Déployer → Gérer les déploiements).
-->
<div class="cadre"><iframe id="pool" title="Pool NFL" allow="clipboard-write"></iframe></div>
<div class="bas" aria-hidden="true"></div>
<div id="sonde" aria-hidden="true" style="position:fixed;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)"></div>
<script>
/* Mode « écran d'accueil » (icône) : iOS donne à la fenêtre la hauteur de
   l'écran MOINS la barre d'état, alors que la page s'affiche sur tout l'écran.
   Tout ce qui est calé sur le bas remonte d'autant (une bande vide d'environ
   59 points sous la navigation). On mesure donc la hauteur réelle de l'écran
   et on place le cadre et la bande du bas d'après elle. Dans Safari, rien ne
   change : la hauteur de la fenêtre y est juste. */
(function(){
  var app = window.navigator.standalone === true ||
            (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if(!app) return;
  var cadre = document.querySelector('.cadre'), bas = document.querySelector('.bas'),
      sonde = document.getElementById('sonde');
  function ajuster(){
    var st = getComputedStyle(sonde),
        haut = parseFloat(st.paddingTop) || 0, pied = parseFloat(st.paddingBottom) || 0,
        portrait = window.innerHeight >= window.innerWidth,
        ecran = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height),
        H = Math.max(window.innerHeight, ecran);
    cadre.style.bottom = 'auto'; cadre.style.height = (H - haut - pied) + 'px';
    bas.style.bottom = 'auto'; bas.style.top = (H - pied) + 'px'; bas.style.height = pied + 'px';
  }
  ajuster();
  window.addEventListener('resize', ajuster);
  window.addEventListener('orientationchange', function(){ setTimeout(ajuster, 300) });
})();
</script>
<noscript>Le pool demande JavaScript.</noscript>
<script>
var SITE = 'https://script.google.com/macros/s/AKfycbz3wEHCysryctN8ihRvqwXq8MpXe_lu4iVDKLW28xHIdjMHr1mTXoJIr45yFdkZSUHP/exec';
var CLE = 'poolNflAccueil';

function lire(){ try{ return JSON.parse(localStorage.getItem(CLE)||'{}')||{} }catch(e){ return {} } }
function ecrire(v){ try{ localStorage.setItem(CLE, JSON.stringify(v)) }catch(e){} }

// L'adresse du site : la page demandée (p, n, s — liens partagés) et
// l'identité gardée ici (u, j, r). Cette adresse intérieure n'est jamais
// affichée : copier le lien de la page d'accueil ne partage pas le jeton. Le site n'utilise l'identité de l'adresse
// que s'il n'en a pas d'autre.
(function(){
  var q = new URLSearchParams(location.search), out = new URLSearchParams();
  ['p','n','s','c'].forEach(function(k){ if(q.get(k)) out.set(k, q.get(k)) });
  out.set('g', '1');   // dit au site qu'il est ouvert ici : pas de bandeau « nouvelle adresse »
  var m = lire();
  // Arrivée depuis le bandeau de l'ancienne adresse : nom d'équipe et rivaux
  // dans l'adresse (jamais le jeton). Pris seulement si rien n'est gardé ici,
  // puis retirés de l'adresse visible pour qu'un lien copié ne les transmette pas.
  var nomOk = function(x){ return typeof x === 'string' && x.length > 0 && x.length <= 60 };
  if(!m.me && nomOk(q.get('u'))){
    m = { me: q.get('u'), jeton: null,
          sel: (q.get('r') || '').split('|').filter(nomOk).slice(0, 8) };
    ecrire(m);
  }
  if(q.has('u') || q.has('r')){
    q.delete('u'); q.delete('r');
    try{ history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '')) }catch(e){}
  }
  if(m.me){ out.set('u', m.me); if(m.jeton) out.set('j', m.jeton); if(m.sel && m.sel.length) out.set('r', m.sel.join('|')) }
  var qs = [];   // %20 plutôt que « + » pour les espaces : sans ambiguïté
  out.forEach(function(v, k){ qs.push(k + '=' + encodeURIComponent(v)) });
  qs = qs.join('&');
  document.getElementById('pool').src = SITE + (qs ? '?' + qs : '');
})();

// Le site annonce chaque changement d'identité (connexion, « Ce n'est pas
// moi », rivaux). On n'écoute que les cadres de Google qui servent Apps
// Script, et on ne garde que des champs attendus, bornés.
window.addEventListener('message', function(e){
  var hote = ''; try{ hote = new URL(e.origin).hostname }catch(x){}
  if(!/\.googleusercontent\.com$/.test(hote)) return;
  var d = e.data;
  if(!d || d.type !== 'pool-nfl-identite') return;
  var me = (typeof d.me === 'string' && d.me.length <= 60) ? d.me : null;
  var sel = Array.isArray(d.sel) ? d.sel.filter(function(x){ return typeof x === 'string' && x.length <= 60 }).slice(0, 8) : [];
  var jeton = (typeof d.jeton === 'string' && /^[A-Za-z0-9-]{20,80}$/.test(d.jeton)) ? d.jeton : null;
  ecrire(me ? { me: me, jeton: jeton, sel: sel } : {});
});
</script>
</body>
</html>
